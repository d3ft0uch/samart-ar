<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Просмотр работы</title>
  <script type="module" src="lib/model-viewer.min.js"></script>
  <script src="works.js"></script>
  <style>
    :root {
      --bg: #17181c;
      --ink: #f0ede6;
      --ink-dim: #9a978f;
      --accent: #e65a28;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      position: relative;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    model-viewer {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: radial-gradient(ellipse at 50% 40%, #24262c 0%, var(--bg) 70%);
      --poster-color: transparent;
    }
    .caption {
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid #2a2c33;
    }
    .caption h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .caption .author { color: var(--accent); font-size: 14px; margin-top: 2px; }
    .caption p { color: var(--ink-dim); font-size: 14px; margin-top: 8px; }
    .hint { color: var(--ink-dim); font-size: 12px; margin-top: 10px; }
    button[slot="ar-button"] {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font: 600 15px system-ui, sans-serif;
      cursor: pointer;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(23, 24, 28, 0.55);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .nav-arrow.prev { left: 12px; }
    .nav-arrow.next { right: 12px; }
    .error {
      flex: 1;
      display: grid;
      place-content: center;
      text-align: center;
      color: var(--ink-dim);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const work = WORKS[params.get("id")];
    const app = document.getElementById("app");
    app.remove(); // строим прямо в body, чтобы flex работал

    if (!work) {
      document.body.insertAdjacentHTML("beforeend",
        `<div class="error">Работа не найдена.<br>Проверь id в ссылке — например, viewer.html?id=1</div>`);
    } else {
      document.title = work.title;
      const iosSrc = work.usdz ? `ios-src="${work.usdz}"` : "";
      document.body.insertAdjacentHTML("beforeend", `
        <model-viewer
          src="${work.model}" ${iosSrc}
          ar ar-modes="webxr scene-viewer quick-look"
          camera-controls auto-rotate auto-rotate-delay="1500"
          shadow-intensity="1" exposure="1.1"
          alt="${work.title}">
          <button slot="ar-button">Посмотреть в зале (AR)</button>
        </model-viewer>
        <div class="caption">
          <h1>${work.title}</h1>
          <div class="author">${work.author}</div>
          <p>${work.description}</p>
<!--          <div class="hint">Вращайте модель пальцем. Кнопка AR поставит объект рядом с вами — работает не на всех устройствах, модель видна в любом случае.</div>-->
        </div>`);

      // Стрелки переключения между работами, по кругу (после последней — снова первая).
      const ids = Object.keys(WORKS);
      if (ids.length > 1) {
        const i = ids.indexOf(params.get("id"));
        const prevId = ids[(i - 1 + ids.length) % ids.length];
        const nextId = ids[(i + 1) % ids.length];
        document.body.insertAdjacentHTML("beforeend", `
          <button class="nav-arrow prev" aria-label="Предыдущая работа"
            onclick="location.href='viewer.html?id=${encodeURIComponent(prevId)}'">‹</button>
          <button class="nav-arrow next" aria-label="Следующая работа"
            onclick="location.href='viewer.html?id=${encodeURIComponent(nextId)}'">›</button>`);
      }
    }
  </script>
</body>
</html>
