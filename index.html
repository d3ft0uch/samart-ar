<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Зал выставки — AR</title>
  <script src="lib/aframe.min.js"></script>
  <script src="lib/mindar-image-aframe.prod.js"></script>
  <script src="works.js"></script>
  <style>
    :root { --bg:#17181c; --ink:#f0ede6; --dim:#9a978f; --accent:#e65a28; }
    * { margin:0; padding:0; box-sizing:border-box; }
    /* ВАЖНО: без background у html/body — иначе <video> MindAR (z-index:-2)
       уходит ЗА фон body и не виден. Фон нужен только у #fallback, чтобы там
       поверх камеры показывать нормальное сообщение. */
    html, body { height:100%; color:var(--ink); background:transparent;
      font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
    a-scene { width:100%; height:100%; display:block; }
    .mindar-ui-overlay { display:none !important; }

    #hud {
      position:fixed; left:0; right:0; top:0; padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;
      background:linear-gradient(#000a, #0000); color:var(--ink); pointer-events:none;
      font-size:14px; letter-spacing:0.02em;
    }
    #hud .name { font-size:16px; font-weight:600; }
    #hud .dim { color:var(--dim); }

    #banner {
      position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      background:#0009; color:var(--ink); border:1px solid #ffffff20;
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      padding:10px 16px; border-radius:999px; font-weight:600; font-size:15px;
      opacity:0; transition:opacity .18s ease; pointer-events:none;
    }
    #banner.on { opacity:1; }

    #fallback {
      position:fixed; inset:0; display:none; place-content:center; text-align:center;
      padding:32px; background:var(--bg);
    }
    #fallback.on { display:grid; }
    #fallback h1 { font-size:20px; font-weight:600; margin-bottom:10px; }
    #fallback p { color:var(--dim); max-width:520px; margin:0 auto 8px; }
    #fallback code { background:#2a2c33; padding:2px 6px; border-radius:4px; font-size:13px; }
    #fallback a { color:var(--accent); }
  </style>
</head>
<body>
  <div id="hud"><div class="name">Зал выставки</div><div class="dim">Наведи камеру на зону — появится 3D-объект</div></div>
  <div id="banner"></div>

  <div id="fallback">
    <div>
      <h1>Таргеты зала ещё не собраны</h1>
      <p>Файл <code id="fbFile">targets/room.mind</code> не найден.</p>
      <p>Собери таргеты из фото зон (см. README) и положи полученный файл рядом.</p>
      <p><a href="admin.html">Открыть служебную страницу →</a></p>
    </div>
  </div>

  <script>
    // Плавно догоняем позу другой entity (нашего mindar-image-target прокси)
    // через lerp/slerp в мировых координатах. Смысл: MindAR перезаписывает
    // трансформацию таргета каждый кадр с sub-pixel дрожью — а мы этой дрожью
    // не подавимся. factor 0..1: чем меньше, тем сильнее сглаживание,
    // но заметнее задержка.
    AFRAME.registerComponent("smooth-follow", {
      schema: {
        target: { type: "selector" },
        // Отдельные фактора для позиции и вращения:
        //  - position чувствителен к отзывчивости (объект должен «жить» на фото);
        //  - rotation зажимаем сильнее — угол проекции очень шумный.
        posFactor: { default: 0.25 },
        rotFactor: { default: 0.08 },
        // Если угол между текущим и целевым вращением меньше этого порога —
        // не двигаем модель вообще. Убивает микро-jitter при спокойной руке,
        // при резком повороте (>порога) сглаживание идёт как обычно.
        rotDeadbandDeg: { default: 0.6 },
      },
      init() {
        this._pos = new THREE.Vector3();
        this._quat = new THREE.Quaternion();
        this._scale = new THREE.Vector3();
        this._first = true;
        this.el.object3D.visible = false;
      },
      tick() {
        const target = this.data.target;
        if (!target || !target.object3D) return;
        const t3d = target.object3D;
        const s3d = this.el.object3D;
        if (!t3d.visible) {
          s3d.visible = false;
          this._first = true;
          return;
        }
        t3d.updateMatrixWorld(true);
        t3d.matrixWorld.decompose(this._pos, this._quat, this._scale);
        if (this._first) {
          s3d.position.copy(this._pos);
          s3d.quaternion.copy(this._quat);
          s3d.scale.copy(this._scale);
          this._first = false;
        } else {
          s3d.position.lerp(this._pos, this.data.posFactor);
          const deadband = this.data.rotDeadbandDeg * Math.PI / 180;
          if (s3d.quaternion.angleTo(this._quat) > deadband) {
            s3d.quaternion.slerp(this._quat, this.data.rotFactor);
          }
          s3d.scale.copy(this._scale);
        }
        s3d.visible = true;
      },
    });

    (async () => {
      // ROOM_CONFIG объявлен через `const` в works.js — это lexical binding, не window.*
      const cfg = (typeof ROOM_CONFIG !== "undefined") ? ROOM_CONFIG : null;
      if (!cfg || !Array.isArray(cfg.spots) || cfg.spots.length === 0) {
        showFallback("В works.js нет ROOM_CONFIG.spots");
        return;
      }
      document.getElementById("fbFile").textContent = cfg.mindFile;

      let ok = false;
      try {
        const r = await fetch(cfg.mindFile, { method: "HEAD" });
        ok = r.ok;
      } catch (_) { ok = false; }
      if (!ok) { showFallback(); return; }

      buildScene(cfg);
    })();

    function showFallback(extra) {
      const fb = document.getElementById("fallback");
      if (extra) {
        const p = document.createElement("p");
        p.textContent = extra;
        fb.querySelector("div").appendChild(p);
      }
      fb.classList.add("on");
      document.getElementById("hud").style.display = "none";
    }

    function buildScene(cfg) {
      const scene = document.createElement("a-scene");
      // Параметры:
      //  - maxTrack: 1 — одновременно один таргет (быстрее и стабильнее);
      //  - filterMinCF / filterBeta — low-pass фильтр позы; меньше значения =
      //    сильнее сглаживание (меньше дрожи, но больше задержки);
      //  - missTolerance — сколько кадров подряд может пропасть трекинг,
      //    прежде чем entity скроется. Больше = меньше «мигания».
      scene.setAttribute("mindar-image",
        `imageTargetSrc: ${cfg.mindFile};` +
        ` maxTrack: 1;` +
        // MinCutoff меньше = меньше шум в статике, Beta большая = быстро реагируем
        // на реальное движение. Основное сглаживание всё равно делает
        // компонент `smooth-follow` ниже (lerp/slerp world-трансформации).
        ` filterMinCF: 0.00001;` +
        ` filterBeta: 1000;` +
        ` warmupTolerance: 5;` +
        ` missTolerance: 15;` +
        ` uiScanning: no; uiLoading: no; uiError: no`);
      scene.setAttribute("color-space", "sRGB");
      // alpha: true — прозрачный canvas, чтобы под ним был виден <video>.
      scene.setAttribute("renderer", "colorManagement: true, physicallyCorrectLights: true, alpha: true");
      scene.setAttribute("vr-mode-ui", "enabled: false");
      scene.setAttribute("device-orientation-permission-ui", "enabled: false");
      // ВАЖНО: без `embedded` — иначе MindAR не рисует поток с камеры.

      const assets = document.createElement("a-assets");
      const seen = new Map();
      cfg.spots.forEach((s) => {
        if (seen.has(s.model)) return;
        const id = `spot-model-${seen.size}`;
        seen.set(s.model, id);
        const a = document.createElement("a-asset-item");
        a.setAttribute("id", id);
        a.setAttribute("src", s.model);
        assets.appendChild(a);
      });
      scene.appendChild(assets);

      const cam = document.createElement("a-camera");
      cam.setAttribute("position", "0 0 0");
      cam.setAttribute("look-controls", "enabled: false");
      scene.appendChild(cam);

      cfg.spots.forEach((s, i) => {
        // proxy: чистый mindar-image-target, невидимый (никаких мешей).
        // Мы читаем его world matrix, но модель к нему не приаттачена.
        const proxy = document.createElement("a-entity");
        proxy.setAttribute("id", `spot-proxy-${i}`);
        proxy.setAttribute("mindar-image-target", `targetIndex: ${i}`);

        // отображаемая модель — лежит в scene root, догоняет proxy через lerp/slerp.
        const holder = document.createElement("a-entity");
        holder.setAttribute("smooth-follow", `target: #spot-proxy-${i}; factor: 0.18`);

        const m = document.createElement("a-gltf-model");
        m.setAttribute("src", `#${seen.get(s.model)}`);
        if (s.scale)    m.setAttribute("scale", s.scale);
        if (s.position) m.setAttribute("position", s.position);
        if (s.rotation) m.setAttribute("rotation", s.rotation);
        holder.appendChild(m);

        proxy.addEventListener("targetFound", () => showBanner(s.title));
        proxy.addEventListener("targetLost",  () => hideBanner(s.title));
        scene.appendChild(proxy);
        scene.appendChild(holder);
      });

      document.body.appendChild(scene);
    }

    let bannerShownFor = null;
    const banner = document.getElementById("banner");
    function showBanner(title) {
      bannerShownFor = title;
      banner.textContent = title;
      banner.classList.add("on");
    }
    function hideBanner(title) {
      if (bannerShownFor !== title) return;
      bannerShownFor = null;
      banner.classList.remove("on");
    }
  </script>
</body>
</html>
